services:
  postgres:
    image: postgres:17
    container_name: oidc-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: oidc_auth

    ports:
      - "5434:5432"

    volumes:
      - oidc_postgres_data:/var/lib/postgresql/data

volumes:
  oidc_postgres_data: